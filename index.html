<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRD // SENTINEL AUDITOR</title>
<style>
  :root {
    --bg-color: #050608;
    --neon-yellow: #fcee0a;
    --neon-cyan: #00f0ff;
    --neon-green: #00ff66;
    --card-bg: rgba(18, 22, 28, 0.95);
    --font-mono: 'Courier New', monospace;
  }
  body {
    background-color: var(--bg-color);
    color: #e0e0e0;
    font-family: var(--font-mono);
    margin: 0;
    padding: 12px;
    display: flex;
    justify-content: center;
  }
  body::before {
    content: " ";
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    background-size: 100% 3px, 6px 100%;
    pointer-events: none;
    z-index: 100;
  }
  .hud {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
    clip-path: polygon(0 0, 92% 0, 100% 5%, 100% 100%, 8% 100%, 0 95%);
    padding: 16px;
    box-sizing: border-box;
  }
  .title-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--neon-yellow);
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  .title-text {
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--neon-yellow);
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(252, 238, 10, 0.6);
  }
  .sub-tag {
    font-size: 0.65rem;
    color: var(--neon-cyan);
    letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .card {
    background: rgba(0, 0, 0, 0.7);
    border-left: 3px solid var(--neon-cyan);
    padding: 8px 10px;
  }
  .card-wide {
    grid-column: span 2;
    border-left-color: var(--neon-yellow);
  }
  .card-lbl {
    font-size: 0.65rem;
    color: #888;
    text-transform: uppercase;
  }
  .card-val {
    font-size: 1.25rem;
    font-weight: bold;
    color: #fff;
    margin-top: 2px;
  }
  .bar-container {
    width: 100%;
    height: 6px;
    background: #111;
    margin-top: 6px;
    border: 1px solid #333;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--neon-yellow);
    box-shadow: 0 0 8px var(--neon-yellow);
    transition: width 0.3s ease;
  }
  .hash-box {
    background: #000;
    border: 1px solid #333;
    padding: 6px;
    margin-top: 8px;
    font-size: 0.58rem;
    color: #aaa;
    word-break: break-all;
  }
  .btn-run {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: var(--neon-yellow);
    color: #000;
    font-family: var(--font-mono);
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 2px;
    border: none;
    cursor: pointer;
    clip-path: polygon(0 0, 95% 0, 100% 30%, 100% 100%, 5% 100%, 0 70%);
    box-shadow: 0 0 12px rgba(252, 238, 10, 0.6);
    text-transform: uppercase;
  }
  .btn-run:active {
    background: #e5d809;
    transform: scale(0.98);
  }
  .terminal {
    background: #000;
    border: 1px solid #222;
    padding: 8px;
    margin-top: 12px;
    height: 80px;
    overflow-y: auto;
    font-size: 0.65rem;
    color: var(--neon-cyan);
  }
</style>
</head>
<body>
<div class="hud">
  <div class="title-bar">
    <div class="title-text">GRD // SENTINEL</div>
    <div class="sub-tag">NIST-800-171 // BURST TELEMETRY</div>
  </div>
  <div class="grid">
    <div class="card">
      <div class="card-lbl">Latency (Avg)</div>
      <div class="card-val" id="lat-val">-- ms</div>
    </div>
    <div class="card">
      <div class="card-lbl">Jitter (mdev)</div>
      <div class="card-val" id="jit-val">-- ms</div>
    </div>
    <div class="card">
      <div class="card-lbl">Packet Loss</div>
      <div class="card-val" id="loss-val" style="color: var(--neon-green);">-- %</div>
    </div>
    <div class="card">
      <div class="card-lbl">Status</div>
      <div class="card-val" id="status-val">READY</div>
    </div>
    <div class="card card-wide">
      <div class="card-lbl">Throughput Goodput</div>
      <div class="card-val" id="tp-val" style="color: var(--neon-yellow);">-- Mbps</div>
      <div class="bar-container"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
  </div>
  <div class="card-lbl" style="margin-top: 4px;">SHA-256 Audit Nonce</div>
  <div class="hash-box" id="hash-val">STANDBY // NO EXECUTION SIGNATURE</div>
  <button class="btn-run" id="btn-run" onclick="executeScan()">[ EXECUTE TELEMETRY AUDIT ]</button>
  <div class="terminal" id="term">> SENTINEL HUD ONLINE // SHA-256 READY</div>
</div>

<script>
function printTerm(msg) {
  const t = document.getElementById('term');
  t.innerHTML += '<br>> ' + msg;
  t.scrollTop = t.scrollHeight;
}

function executeScan() {
  const btn = document.getElementById('btn-run');
  btn.disabled = true;
  btn.innerText = "ENGAGED // RUNNING...";
  printTerm("Starting burst network probe...");

  fetch('/api/run_audit')
    .then(res => res.json())
    .then(data => {
      btn.disabled = false;
      btn.innerText = "[ EXECUTE TELEMETRY AUDIT ]";
      const ping = data.ping_metrics;
      const dl = data.download_metrics;

      document.getElementById('lat-val').innerText = ping.avg_ms.toFixed(2) + " ms";
      document.getElementById('jit-val').innerText = ping.mdev_ms.toFixed(2) + " ms";
      document.getElementById('loss-val').innerText = ping.packet_loss_pct.toFixed(1) + "%";
      document.getElementById('status-val').innerText = data.status;
      document.getElementById('status-val').style.color = (data.status === "PASS") ? "var(--neon-green)" : "#ff0055";
      document.getElementById('tp-val').innerText = dl.mbps.toFixed(2) + " Mbps";
      document.getElementById('hash-val').innerText = data.sha256_hash;

      const pct = Math.min(Math.round((dl.mbps / 500) * 100), 100);
      document.getElementById('bar-fill').style.width = pct + "%";

      printTerm("Audit " + data.status + " // Loss: " + ping.packet_loss_pct + "% // Nonce: " + data.sha256_hash.substring(0, 12) + "...");
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "[ EXECUTE TELEMETRY AUDIT ]";
      printTerm("FATAL // " + err);
    });
}
</script>
</body>
</html>
