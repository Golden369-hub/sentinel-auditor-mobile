<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL AUDITOR</title>
<style>
:root {
  --bg-color: #050608;
  --neon-yellow: #FEE00A;
  --neon-cyan: #00ff66;
  --neon-red: #00ff66;
  --card-bg: rgba(18, 22, 28, 0.95);
  --font-mono: 'Courier New', monospace;
}
body {
  background-color: var(--bg-color);
  color: #e0e0e0;
  font-family: var(--font-mono);
  margin: 0;
  padding: 12px;
  display: flex;
  justify-content: center;
}
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
  background-size: 100% 3px, 6px 100%;
  pointer-events: none;
  z-index: 100;
}
.hud {
  width: 100%;
  max-width: 440px;
  background: var(--card-bg);
  border: 2px solid var(--neon-cyan);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
  clip-path: polygon(0 0, 92% 0, 100% 5%, 100% 100%, 0 100%);
  padding: 16px;
  box-sizing: border-box;
}
.title-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 2px solid var(--neon-yellow);
  padding-bottom: 6px;
  margin-bottom: 12px;
}
.title-text {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--neon-yellow);
  letter-spacing: 2px;
  text-shadow: 0 0 8px rgba(252, 238, 10, 0.6);
}
.sub-tag {
  font-size: 0.65rem;
  color: var(--neon-cyan);
  letter-spacing: 1px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.card {
  background: rgba(0, 0, 0, 0.7);
  border-left: 3px solid var(--neon-cyan);
  padding: 8px 10px;
}
.card-wide {
  grid-column: span 2;
  border-left-color: var(--neon-yellow);
}
.card-lbl {
  font-size: 0.65rem;
  color: #888;
  text-transform: uppercase;
}
.card-val {
  font-size: 1.25rem;
  font-weight: bold;
  color: #fff;
  margin-top: 2px;
}
.card-val-sm {
  font-size: 0.95rem;
  font-weight: bold;
  color: var(--neon-cyan);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-container {
  width: 100%;
  height: 6px;
  background: #111;
  margin-top: 6px;
  border: 1px solid #333;
}
.bar-fill {
  height: 100%;
  width: 0%;
  background: var(--neon-yellow);
  box-shadow: 0 0 8px var(--neon-yellow);
  transition: width 0.3s ease;
}
.hash-box {
  background: #000;
  border: 1px solid #333;
  padding: 6px;
  margin-top: 8px;
  font-size: 0.58rem;
  color: #aaa;
  word-break: break-all;
}
.btn-run {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: var(--neon-yellow);
  color: #000;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 900;
  letter-spacing: 2px;
  clip-path: polygon(0 0, 95% 0, 100% 30%, 100% 100%, 5% 100%, 0 70%);
  box-shadow: 0 0 12px rgba(252, 238, 10, 0.6);
  text-transform: uppercase;
  border: none;
  cursor: pointer;
}
.btn-run:active {
  background: #e5d809;
  transform: scale(0.98);
}
.btn-export {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background: var(--neon-cyan);
  color: #000;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 900;
  letter-spacing: 1.5px;
  clip-path: polygon(0 0, 95% 0, 100% 30%, 100% 100%, 5% 100%, 0 70%);
  box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
  text-transform: uppercase;
  border: none;
  cursor: pointer;
}
.btn-export:active {
  transform: scale(0.98);
}
.terminal {
  background: #000;
  border: 1px solid #222;
  padding: 8px;
  margin-top: 12px;
  height: 80px;
  overflow-y: auto;
  font-size: 0.65rem;
  color: var(--neon-cyan);
}
</style>
</head>
<body>
<div class="hud">
  <div class="title-bar">
    <div class="title-text">GRD // SENTINEL</div>
    <div class="sub-tag">NIST-800-171 // CARRIER AUDIT</div>
  </div>
  <div class="grid">
    <div class="card card-wide">
      <div class="card-lbl">Active ISP // Autonomous System</div>
      <div class="card-val-sm" id="isp-val">DETECTING...</div>
    </div>
    <div class="card">
      <div class="card-lbl">Latency (Avg)</div>
      <div class="card-val" id="lat-val">--<span style="font-size:0.7rem"> ms</span></div>
    </div>
    <div class="card">
      <div class="card-lbl">Jitter (Mdev)</div>
      <div class="card-val" id="jit-val">--<span style="font-size:0.7rem"> ms</span></div>
    </div>
    <div class="card">
      <div class="card-lbl">Packet Loss</div>
      <div class="card-val" id="loss-val" style="color:var(--neon-cyan)">0.0%</div>
    </div>
    <div class="card">
      <div class="card-lbl">DNS Latency</div>
      <div class="card-val" id="dns-val">--<span style="font-size:0.7rem"> ms</span></div>
    </div>
    <div class="card card-wide">
      <div class="card-lbl">Throughput Goodput</div>
      <div class="card-val" id="tp-val">0.00 <span style="font-size:0.7rem">Mbps</span></div>
      <div class="bar-container"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
  </div>
  <div class="card-lbl" style="margin-top: 4px;">Telemetry SHA-256 Ledger</div>
  <div class="hash-box" id="hash-val">STANDBY // ZERO-DRIFT</div>
  <button class="btn-run" id="btn-run" onclick="executeScan()">[ EXECUTE TELEMETRY AUDIT ]</button>
  <button class="btn-export" id="btn-export" onclick="exportAuditJson()">[ EXPORT AUDIT LEDGER (JSON) ]</button>
  <div class="terminal" id="term">> SENTINEL HUD READY</div>
</div>

<script>
function printTerm(msg) {
  const t = document.getElementById('term');
  t.innerHTML += '<br>' + msg;
  t.scrollTop = t.scrollHeight;
}

function executeScan() {
  const btn = document.getElementById('btn-run');
  btn.disabled = true;
  btn.innerText = '[ ENGAGED // RUNNING... ]';
  printTerm('Starting multi-vector carrier audit...');

  fetch('/api/run_audit')
    .then(res => res.json())
    .then(data => {
      btn.disabled = false;
      btn.innerText = '[ EXECUTE TELEMETRY AUDIT ]';
      const ping = data.ping_metrics;
      const dl = data.download_metrics;
      const dns = data.dns_metrics;
      const isp = data.isp_metrics;

      document.getElementById('isp-val').innerText = isp.isp + ' (' + isp.query + ')';
      document.getElementById('lat-val').innerHTML = ping.avg + '<span style="font-size:0.7rem"> ms</span>';
      document.getElementById('jit-val').innerHTML = ping.mdev + '<span style="font-size:0.7rem"> ms</span>';
      document.getElementById('loss-val').innerText = ping.packet_loss;
      document.getElementById('dns-val').innerHTML = dns.dns_time_ms + '<span style="font-size:0.7rem"> ms</span>';
      document.getElementById('tp-val').innerHTML = dl.mbps + ' <span style="font-size:0.7rem">Mbps</span>';
      document.getElementById('hash-val').innerText = data.status_hash;

      const pct = Math.min(Math.round((dl.mbps / 500) * 100), 100);
      document.getElementById('bar-fill').style.width = pct + '%';

      printTerm("Carrier: " + isp.isp + " [" + isp.as + "]");
      printTerm("Audit " + data.status + " // " + data.status_hash.substring(0, 16) + "...");
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = '[ EXECUTE TELEMETRY AUDIT ]';
      printTerm("FATAL // " + err);
    });
}

async function exportAuditJson() {
  const auditPayload = {
    framework: "GRD Sentinel Auditor Mobile",
    standard: "NIST SP 800-171 AU-9",
    timestamp: new Date().toISOString(),
    metrics: {
      isp: document.getElementById('isp-val').innerText,
      latency_avg_ms: document.getElementById('lat-val').innerText.replace(' ms', '').trim(),
      jitter_mdev_ms: document.getElementById('jit-val').innerText.replace(' ms', '').trim(),
      packet_loss: document.getElementById('loss-val').innerText.trim(),
      dns_latency_ms: document.getElementById('dns-val').innerText.replace(' ms', '').trim(),
      throughput_mbps: document.getElementById('tp-val').innerText.replace(' Mbps', '').trim()
    },
    telemetry_hash: document.getElementById('hash-val').innerText.trim(),
    system_integrity: "ZERO_DRIFT"
  };

  const rawJson = JSON.stringify(auditPayload, null, 2);
  const encoder = new TextEncoder();
  const hashBuffer = await crypto.subtle.digest("SHA-256", encoder.encode(rawJson));
  const sha256 = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");

  const sealedRecord = {
    ...auditPayload,
    au9_sha256_seal: sha256
  };

  const blob = new Blob([JSON.stringify(sealedRecord, null, 2)], { type: "application/json" });
  const downloadUrl = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = downloadUrl;
  link.download = `sentinel-audit-${Date.now()}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(downloadUrl);
  printTerm("AUDIT LEDGER EXPORTED (AU-9 SEALED)");
}
</script>
</body>
</html>
